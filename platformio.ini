[platformio]
default_envs = esp32

[env]
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Werror=return-type
  -D GPS_LOGGER_VERSION=\"2.0.0\"

[env:esp32]
platform = espressif32@7.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  sparkfun/SparkFun u-blox GNSS Arduino Library@2.2.29
  adafruit/Adafruit SSD1306@2.5.17
  adafruit/Adafruit GFX Library@1.12.6
  h2zero/NimBLE-Arduino@2.5.1
build_flags =
  ${env.build_flags}
  -D SSD1306_NO_SPLASH

[env:native]
platform = native
test_framework = unity
lib_compat_mode = off
build_flags =
  ${env.build_flags}
  -Wpedantic
